<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- GB/T 9704-2012 font names. The licensed FangSong/KaiTi/XiaoBiaoSong
       fonts in /usr/share/fonts/truetype/gongwen take precedence; open-source
       substitutes remain as fallbacks. Licensed fonts mounted by the operator
       under /usr/share/fonts also win through normal family matching. -->
  <match target="pattern">
    <test name="family" qual="any"><string>宋体</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>AR PL SungtiL GB</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SimSun</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>AR PL SungtiL GB</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>黑体</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SimHei</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>楷体</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>KaiTi_GB2312</string>
      <string>AR PL KaitiM GB</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>楷体_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>KaiTi_GB2312</string>
      <string>AR PL KaitiM GB</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>KaiTi</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>KaiTi_GB2312</string>
      <string>AR PL KaitiM GB</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>仿宋</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>FangSong_GB2312</string>
      <string>Zhuque Fangsong (technical preview)</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>仿宋_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>FangSong_GB2312</string>
      <string>Zhuque Fangsong (technical preview)</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>FangSong</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>FangSong_GB2312</string>
      <string>Zhuque Fangsong (technical preview)</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>方正小标宋简体</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>FZXiaoBiaoSong-B05S</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>FZXiaoBiaoSong</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>FZXiaoBiaoSong-B05S</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>FZKai</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>KaiTi_GB2312</string>
      <string>AR PL KaitiM GB</string>
    </edit>
  </match>
</fontconfig>
