<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- GB/T 9704-2012 font names mapped to the open-source substitutes
       installed in the image. Licensed 方正/中易 fonts can be mounted under
       /usr/share/fonts; exact family names take precedence over these rules. -->
  <match target="pattern">
    <test name="family" qual="any"><string>宋体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>AR PL SungtiL GB</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SimSun</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>AR PL SungtiL GB</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>黑体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SimHei</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>楷体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>AR PL KaitiM GB</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>楷体_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>AR PL KaitiM GB</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>KaiTi</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>AR PL KaitiM GB</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>仿宋</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Zhuque Fangsong (technical preview)</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>仿宋_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Zhuque Fangsong (technical preview)</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>FangSong</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Zhuque Fangsong (technical preview)</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>方正小标宋简体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>FZXiaoBiaoSong</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>FZKai</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>AR PL KaitiM GB</string></edit>
  </match>
</fontconfig>
