[project]
name = "wps-converter"
version = "0.1.0"
description = "Stateless WPS and ET document conversion service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0,<25",
    "fastapi>=0.116.0,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1",
    "pytest>=8.4.0,<9",
    "pytest-asyncio>=1.1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wps_converter"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
